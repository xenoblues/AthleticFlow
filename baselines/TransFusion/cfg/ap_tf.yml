# TransFusion on ap (configuration of the seed-0 checkpoint weights/ap/tf.pt)
dataset: 'ap'
t_his: 15
t_pred: 60
# paths relative to --data_root (default: <AthleticFlow repo>/data)
multimodal_path: 'AthleticsPose/multimodal/t_his15_1_thre0.500_t_pred60_thre0.100_index_filterd.npz'
data_candi_path: 'AthleticsPose/multimodal/data_candi_t_his15_t_pred60_skiprate15.npz'
# jitter of the first predicted frames uses the observed history (per-sequence protocol)
jitter_seam: 'observed'

# training
batch_size: 1024
num_epoch: 501
num_data_sample: 50000
num_val_data_sample: 5000
lr: 1.e-3

# diffusion / denoiser
n_pre: 15
padding: 'LastFrame'
Complete: True
noise_steps: 1000
ddim_timesteps: 100
scheduler: 'Cosine'
num_layers: 6
num_heads: 8
latent_dims: 512
dropout: 0.2
mod_train: 0.5
mod_test: 1.
