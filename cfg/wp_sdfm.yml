# SDFM baseline
dataset: 'wp'
t_his: 25
t_pred: 100
padding: 'LastFrame'
# training
batch_size: 1024
num_epoch: 1001
num_data_sample: 50000
num_val_data_sample: 5000
lr: 1.e-3
mod_train: 0.5          # probability of keeping the condition during training (classifier-free guidance)
mod_test: 1.
# temporal representation: first n_pre coefficients of the t_his + t_pred frames
use_dct: True
n_pre: 25
# network
model_name: 'SDFM'
num_layers: 6
num_heads: 8
latent_dims: 512
dropout: 0.2
# sampling
cfg_scale: 0.5
# WorldPose results were computed with the jitter seam on the model's reconstruction of the last observed frames
jitter_seam: 'predicted'
